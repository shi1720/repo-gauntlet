name: Polyglot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Python control plane
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_schema.py
      - run: python -m repogauntlet.cli validate PY-INTERVAL-001

  java:
    name: Java environment
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - run: PYTHONPATH=core python -m repogauntlet.cli validate JAVA-LEDGER-001
      - run: PYTHONPATH=core python scripts/generate_task_reports.py JAVA-LEDGER-001 ci-reports
      - run: PYTHONPATH=core python scripts/verify_reports.py JAVA-LEDGER-001
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repogauntlet-java-reports
          path: ci-reports/JAVA-LEDGER-001

  rust:
    name: Rust environment
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: rustup default 1.88.0
      - run: PYTHONPATH=core python -m repogauntlet.cli validate RUST-PLANNER-001
      - run: PYTHONPATH=core python scripts/generate_task_reports.py RUST-PLANNER-001 ci-reports
      - run: PYTHONPATH=core python scripts/verify_reports.py RUST-PLANNER-001
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repogauntlet-rust-reports
          path: ci-reports/RUST-PLANNER-001

  native-and-web:
    name: C++ and TypeScript environments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: PYTHONPATH=core python -m repogauntlet.cli validate CPP-TOPK-001
      - run: PYTHONPATH=core python -m repogauntlet.cli validate TS-BATCHER-001
      - run: PYTHONPATH=core python scripts/verify_reports.py PY-INTERVAL-001 CPP-TOPK-001 TS-BATCHER-001
      - run: npm run lint
      - run: npm run build
