name: Polyglot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Python control plane
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_schema.py
      - run: python -m repogauntlet.cli validate PY-INTERVAL-001

  java:
    name: Java environment
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: PYTHONPATH=core python -m repogauntlet.cli validate JAVA-LEDGER-001

  rust:
    name: Rust environment
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: rustup default 1.88.0
      - run: PYTHONPATH=core python -m repogauntlet.cli validate RUST-PLANNER-001

  native-and-web:
    name: C++ and TypeScript environments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: PYTHONPATH=core python -m repogauntlet.cli validate CPP-TOPK-001
      - run: PYTHONPATH=core python -m repogauntlet.cli validate TS-BATCHER-001
      - run: PYTHONPATH=core python scripts/verify_reports.py PY-INTERVAL-001 CPP-TOPK-001 TS-BATCHER-001
      - run: npm run lint
      - run: npm run build
