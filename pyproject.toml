[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repogauntlet"
version = "0.1.0"
description = "Reproducible polyglot software-engineering environments for coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shivam Gupta" }]
keywords = ["ai-agents", "evaluation", "software-engineering", "benchmark", "rl-environments"]
dependencies = ["jsonschema>=4.22,<5"]

[project.scripts]
repogauntlet = "repogauntlet.cli:main"

[tool.setuptools]
package-dir = { "" = "core" }

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
